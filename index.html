<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<meta name="theme-color" content="#7cb342">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f1e1c;--tx2:#5f5e5a;--tx3:#87857e;--bd:#e4e2dc;--bd2:#cfccc4;--ac:#1d64b8;--acbg:#e6f0fb;--warn:#a86a00;--dan:#c0392b;--danbg:#fdeeec;--ok:#2e7d32;--mark:#ffe17a}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262624;--tx:#f1efe8;--tx2:#bdbbb2;--tx3:#8f8d86;--bd:#3a3936;--bd2:#4c4b47;--ac:#86b6ef;--acbg:#1f3550;--warn:#e3a94a;--dan:#f19388;--danbg:#4a2422;--ok:#82c785;--mark:#6e5c12}}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:6px 12px 110px;min-height:100vh}
#app.nv{display:flex;flex-direction:column;padding-bottom:0}
.top{display:flex;align-items:center;gap:4px;min-height:46px;margin-bottom:4px}
.top h1{font-size:1.4rem;font-weight:600;margin:0 4px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border:0;background:none;color:var(--tx2);font-size:1.6rem;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;flex:none;padding:0}
.ib:active{background:var(--bd)}
.ib.sm{width:38px;height:38px;font-size:1.2rem}
.ib.on{color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd2);border-radius:14px;padding:0 4px 0 12px;height:48px;margin-bottom:4px;font-size:1.2rem;color:var(--tx3)}
.search input{flex:1;border:0;outline:0;background:none;font-size:1rem;height:100%;min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.sec{font-size:.8rem;color:var(--tx3);margin:12px 6px 2px}
.row{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 6px;border-bottom:1px solid var(--bd);font-size:1rem;cursor:pointer}
.row:active{background:var(--bd)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{color:var(--tx3);font-size:.85rem;white-space:nowrap}
.row.sel{background:var(--acbg);color:var(--ac);border-radius:10px}
.row.acc{color:var(--ac);border-bottom:0}
.row.sm{min-height:40px;font-size:.95rem}
.ic{font-size:1.35rem;color:var(--tx2);flex:none}
.acc .ic,.sel .ic{color:inherit}
.tg{width:28px;height:38px;border:0;background:none;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--tx3);flex:none;padding:0;margin-right:-6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px 8px 14px;margin-bottom:6px;cursor:pointer}
.card.pin{border-color:var(--warn)}
.card .ch{display:flex;gap:8px;align-items:flex-start}
.card h4{margin:0;font-size:1.05rem;font-weight:600;flex:1;line-height:1.3}
.card p{margin:2px 0 0;color:var(--tx2);font-size:.95rem;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.pinic{color:var(--warn);font-size:1.2rem}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;font-size:.8rem;color:var(--tx3);margin-top:4px}
.path{color:var(--ac)}
.rem{color:var(--tx2)}
.dan{color:var(--dan)}
.mut{color:var(--tx3);font-weight:400}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--tx3);text-align:center;padding:28px 10px;line-height:1.5}
.crumb{font-size:.85rem;color:var(--ac);margin:-4px 8px 4px}
.fab{position:fixed;right:18px;bottom:22px;width:66px;height:66px;border-radius:50%;border:0;background:#7cb342;color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer;z-index:10}
.catsel{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border-radius:14px;border:1px solid var(--ac);background:var(--acbg);color:var(--ac);font-size:1rem;text-align:left;cursor:pointer}
.catsel span{flex:1;min-width:0}
.tin{width:100%;border:0;outline:0;background:none;font-size:1.35rem;font-weight:600;padding:10px 4px 2px}
.txa{width:100%;border:0;outline:0;background:none;font-size:1.05rem;line-height:1.55;padding:4px 4px;resize:none;min-height:2.2em;overflow:hidden;display:block}
.tin::placeholder,.txa::placeholder{color:var(--tx3)}
.item{display:flex;align-items:flex-start;gap:2px;border-bottom:1px solid var(--bd)}
.item .itx{flex:1;border:0;outline:0;background:none;font-size:1.05rem;line-height:1.35;padding:11px 0 9px;min-width:0;resize:none;overflow:hidden;display:block}
.item.ok .itx{text-decoration:line-through;color:var(--tx3)}
.ck{width:42px;height:44px;border:0;background:none;font-size:1.5rem;color:var(--tx2);padding:0;flex:none}
.item.ok .ck{color:var(--ok)}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.phs:empty{margin:0}
.pt{width:96px;height:96px;border-radius:10px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:1.6rem;overflow:hidden;cursor:pointer}
.pt img{width:100%;height:100%;object-fit:cover}
.remrow{display:flex;align-items:center;gap:12px;border:1px solid var(--bd2);border-radius:14px;padding:6px 6px 6px 14px;margin:10px 0;font-size:1rem;cursor:pointer}
.remrow>i{font-size:1.4rem;color:var(--dan)}
.remrow>div{flex:1}
.remrow .sub{font-size:.9rem;color:var(--tx2)}
.remrow.past{border-color:var(--dan);background:var(--danbg)}
.st{font-size:.8rem;color:var(--tx3);display:flex;align-items:center;gap:4px}
.st.ok{color:var(--ok)}.st.err{color:var(--dan)}
.tbar{position:sticky;bottom:0;margin:auto -12px 0;background:var(--card);border-top:1px solid var(--bd);padding:0 0 calc(4px + env(safe-area-inset-bottom));z-index:10}
.tbar .tools{display:flex;justify-content:space-around;padding-top:4px;max-width:640px;margin:0 auto}
.tbar .ib{font-size:1.75rem;width:64px;height:50px}
.shr{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--bd);padding:2px 10px;max-width:640px;margin:0 auto}
.shr .lb{flex:1;font-size:.9rem;color:var(--tx2);display:flex;align-items:center;gap:6px}
.shr .ib{font-size:1.6rem;width:52px;height:44px}
.wa{color:#1d9e75!important}.ml{color:var(--ac)!important}
.sw{display:flex;flex-wrap:wrap;gap:14px;padding:4px 4px 8px}
.sw button{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;padding:0}
.sw button.on{outline:3px solid var(--tx);outline-offset:3px}
.fv{position:relative;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.95rem;flex:none;overflow:hidden}
.fv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:var(--card)}
a.row{color:inherit;text-decoration:none}
.chp{display:flex;gap:6px;margin:6px 2px}
.chp button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--bd2);background:var(--card);font-size:.9rem;cursor:pointer}
.chp button.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--tx3)}
.kp b{display:block;font-size:1.3rem;color:var(--tx)}
.bar{padding:5px 6px;cursor:pointer;border-radius:8px}
.bar:active{background:var(--bd)}
.bar .l{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.bar .l span:last-child{color:var(--tx3);font-size:.82rem;white-space:nowrap}
.bar .b{height:7px;border-radius:4px;background:var(--bd);margin-top:3px}
.bar .b i{display:block;height:100%;border-radius:4px}
.card.selc{border-color:var(--ac);background:var(--acbg)}
.card .ckb{font-size:1.4rem;color:var(--tx3);margin:-2px 0 0 -2px}
.card.selc .ckb{color:var(--ac)}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);z-index:20;padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.selbar>div{display:flex;align-items:center;gap:2px;max-width:640px;margin:0 auto}
.selbar .lb{flex:1;font-size:1rem;font-weight:600;padding-left:4px}
.selbar .ib{font-size:1.6rem}
.icom{display:block;width:calc(100% - 42px);margin:-4px 0 6px 42px;border:0;border-left:3px solid var(--bd2);outline:0;background:none;resize:none;overflow:hidden;font-size:.95rem;line-height:1.4;color:var(--tx2);padding:3px 8px;min-height:1.9em}
.icom:focus{background:var(--card);border-radius:0}
.addc{margin:-8px 0 4px 42px;font-size:.82rem;color:var(--ac);background:none;border:0;padding:4px 0;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.words{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px}
.words span{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;font-size:.85rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sh{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sh h3{margin:0 4px 12px;font-size:1.2rem;font-weight:600}
.sh p{margin:0 4px 12px;line-height:1.5;color:var(--tx2)}
.inp{width:100%;height:54px;border:1px solid var(--bd2);border-radius:12px;background:var(--bg);padding:0 12px;font-size:1.05rem;outline:0}
.inp:focus{border-color:var(--ac)}
.lbl{display:block;font-size:.85rem;color:var(--tx3);margin:14px 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.acts{display:flex;gap:8px;margin-top:16px;align-items:center}
.btn{height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--bd2);background:var(--card);font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.dan{color:var(--dan);border-color:var(--dan)}
.btn.wide{width:100%;justify-content:flex-start;margin-bottom:8px}
.hint{font-size:.85rem!important;color:var(--tx3)!important;margin-top:12px!important}
.photo-big{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:#000}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2b2a28;color:#fff;padding:12px 18px;border-radius:12px;font-size:.95rem;max-width:90vw;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
.load{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--tx3);padding:60px 0}
.spin{animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const S = { sel: null, cats: [], notes: [], links: [], lnkEdit: false, statsCat: null, statsDays: 90, url: '', view: { v: 'home' }, stack: [], q: '', open: {}, photo: {}, edit: null, lastCat: null, uploading: 0 };
try { S.open = JSON.parse(localStorage.getItem('bn_open') || '{}'); S.lastCat = localStorage.getItem('bn_last') || null; } catch (e) {}
function remember() { try { localStorage.setItem('bn_open', JSON.stringify(S.open)); if (S.lastCat) localStorage.setItem('bn_last', S.lastCat); } catch (e) {} }

// ── servidor ──
const CFG = { url: '', key: '' };
try { CFG.url = localStorage.getItem('nt_url') || ''; CFG.key = localStorage.getItem('nt_key') || ''; } catch (e) {}
async function api(fn, ...args) {
  if (window.__mockApi) return window.__mockApi(fn, args);
  if (!CFG.url || !CFG.key) throw new Error('Falta configurar la conexión');
  let r, d;
  try {
    r = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: CFG.key, fn, args }) });
  } catch (e) { throw new Error('Sin conexión'); }
  try { d = await r.json(); } catch (e) { throw new Error('Respuesta no válida del servidor (' + r.status + ')'); }
  if (!d.ok) throw new Error(d.error || 'Error del servidor');
  return d.data;
}
// Copia local de los datos para abrir rápido y ver las notas sin señal.
let cacheT = null;
function cacheLater() {
  clearTimeout(cacheT);
  cacheT = setTimeout(() => { try { localStorage.setItem('nt_cache', JSON.stringify({ cats: S.cats, notes: S.notes, links: S.links, at: Date.now() })); } catch (e) {} }, 800);
}
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^(Exception|Error):\s{0,9}/, ''); }

// ── utilidades ──
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const normC = c => c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const norm = s => normC(String(s || ''));
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms || 2600); }

const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIA = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const p2 = x => String(x).padStart(2, '0');
const hm = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
const dayDiff = (a, b) => Math.round((new Date(a.getFullYear(), a.getMonth(), a.getDate()) - new Date(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5);
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso), n = new Date(), k = dayDiff(n, d);
  if (k === 0) return 'Hoy ' + hm(d);
  if (k === 1) return 'Ayer ' + hm(d);
  return d.getDate() + ' ' + MES[d.getMonth()] + (d.getFullYear() !== n.getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtRem(iso) {
  const d = new Date(iso), k = dayDiff(d, new Date());
  const s = k === 0 ? 'Hoy' : k === 1 ? 'Mañana' : k === -1 ? 'Ayer' : DIA[d.getDay()] + ' ' + d.getDate() + ' ' + MES[d.getMonth()];
  return s + ' · ' + hm(d);
}

// ── categorías ──
const cat = id => S.cats.find(c => c.id === id);
const kids = pid => S.cats.filter(c => (c.parent || null) === (pid || null)).sort((a, b) => a.name.localeCompare(b.name, 'es'));
function path(id) { const p = []; let c = cat(id), g = 0; while (c && g++ < 30) { p.unshift(c.name); c = cat(c.parent); } return p.join(' › ') || 'Sin categoría'; }
function desc(id) { const out = [id]; kids(id).forEach(k => out.push(...desc(k.id))); return out; }
function countDeep(id) { const ids = desc(id); return S.notes.filter(n => ids.includes(n.cat)).length; }
const COLORS = ['#378add', '#1d9e75', '#639922', '#ba7517', '#d85a30', '#e24b4a', '#7f77dd', '#d4537e', '#888780'];
function catColor(id) { let c = cat(id), g = 0; while (c && g++ < 30) { if (c.color) return c.color; c = cat(c.parent); } return ''; }
const fic = id => { const k = catColor(id); return `<i class="ti ti-folder ic"${k ? ` style="color:${k}"` : ''}></i>`; };
const sortNotes = a => a.slice().sort((x, y) => (y.pinned - x.pinned) || String(y.updated).localeCompare(String(x.updated)));

// ── búsqueda ──
const terms = q => norm(q).split(/\s+/).filter(Boolean);
const noteText = n => [n.title, n.text, (n.items || []).map(i => i.t + (i.c ? '\n' + i.c : '')).join('\n')].join('\n');
function matches(n, ts) { const h = norm(noteText(n) + '\n' + path(n.cat) + '\n' + noteText(n).split('\n').map(l => (parseTag(l) || {}).tag || '').join(' ')); return ts.every(t => h.includes(t)); }
function hl(text, ts) {
  text = String(text || '');
  if (!ts || !ts.length) return esc(text);
  let nm = ''; const map = [];
  for (let i = 0; i < text.length; i++) { const c = normC(text[i]); for (let k = 0; k < c.length; k++) { nm += c[k]; map.push(i); } }
  const mk = new Array(text.length).fill(false);
  ts.forEach(t => { let p = nm.indexOf(t); while (p >= 0) { for (let k = p; k < p + t.length; k++) mk[map[k]] = true; p = nm.indexOf(t, p + t.length); } });
  let out = '', on = false;
  for (let i = 0; i < text.length; i++) {
    if (mk[i] && !on) { out += '<mark>'; on = true; }
    if (!mk[i] && on) { out += '</mark>'; on = false; }
    out += esc(text[i]);
  }
  return out + (on ? '</mark>' : '');
}
function snippet(n, ts) {
  const body = [n.text, (n.items || []).map(i => (i.ok ? '✓ ' : '• ') + i.t).join('  ')].filter(Boolean).join('  ').replace(/\s+/g, ' ').trim();
  if (!ts || !ts.length) return body.slice(0, 160);
  const nb = norm(body); let p = -1;
  for (const t of ts) { p = nb.indexOf(t); if (p >= 0) break; }
  if (p < 0) return body.slice(0, 160);
  const s = Math.max(0, p - 40);
  return (s > 0 ? '…' : '') + body.slice(s, s + 160);
}

// ── navegación ──
function go(v) { S.sel = null; S.stack.push(S.view); S.view = v; try { history.pushState({ d: S.stack.length }, ''); } catch (e) {} render(); window.scrollTo(0, 0); }
function back() { if (S.sel) { S.sel = null; return render(); } if (S.view.v === 'note') leaveNote(); S.view = S.stack.pop() || { v: 'home' }; render(); }
function render() {
  const v = S.view.v;
  if (v !== 'setup' && S.cats.length) cacheLater();
  $('#app').classList.toggle('nv', v === 'note');
  $('#app').innerHTML = v === 'cat' ? vCat() : v === 'note' ? vNote() : v === 'rem' ? vRem() : v === 'all' ? vAll() : v === 'links' ? vLinks() : v === 'stats' ? vStats() : v === 'setup' ? vSetup() : vHome();
  if (v === 'note') { grow($('#tx')); document.querySelectorAll('#items .icom, #items .itx').forEach(grow); status(); }
  if (S.sel && v !== 'note') { $('#app').insertAdjacentHTML('beforeend', selBar()); document.querySelectorAll('#app .fab').forEach(f => f.remove()); }
}

// ── tarjetas ──
function card(n, o) {
  o = o || {};
  const ts = o.ts || [], ph = (n.photos || []).length, r = n.reminder, past = r && new Date(r) < new Date(), s = snippet(n, ts);
  const k = catColor(n.cat);
  const sel = S.sel && S.sel.has(n.id);
  return `<div class="card${n.pinned ? ' pin' : ''}${sel ? ' selc' : ''}"${k ? ` style="box-shadow:inset 4px 0 0 ${k}"` : ''} onclick="cardTap('${n.id}')" oncontextmenu="event.preventDefault();selStart('${n.id}')">
    <div class="ch">${S.sel ? `<i class="ti ti-${sel ? 'square-check' : 'square'} ckb"></i>` : ''}<h4>${n.title ? hl(n.title, ts) : '<span class="mut">Sin título</span>'}</h4>${n.pinned ? '<i class="ti ti-pin pinic"></i>' : ''}</div>
    ${s ? `<p>${hl(s, ts)}</p>` : ''}
    <div class="meta"><span>${fmtDate(n.updated)}</span>
      ${r ? `<span class="${past ? 'dan' : 'rem'}"><i class="ti ti-bell"></i> ${fmtRem(r)}</span>` : ''}
      ${ph ? `<span><i class="ti ti-photo"></i> ${ph}</span>` : ''}
      ${o.path ? `<span class="path">${esc(path(n.cat))}</span>` : ''}</div></div>`;
}

// ── inicio ──
function vHome() {
  return `<div class="top"><h1>Notes</h1><button class="ib" onclick="reload()" aria-label="Actualizar"><i class="ti ti-refresh"></i></button><button class="ib" onclick="settings()" aria-label="Ajustes"><i class="ti ti-settings"></i></button></div>
  <div class="search"><i class="ti ti-search"></i><input id="q" type="search" placeholder="Buscar en todas las notas" value="${esc(S.q)}" oninput="onQ(this.value)" autocomplete="off">

// ── estadísticas ──
const TAG_RE = /^\s*(\d{2,4})[\s-]?([A-Za-z]{1,5})[\s-]?(\d{2,5}[A-Za-z]?)(?![A-Za-z0-9])\s*[:\-–.]?\s*(.*)$/;
const VARS = { A: 'Análisis', C: 'Conductividad', D: 'Densidad', E: 'Voltaje', F: 'Flujo', H: 'Manual', I: 'Corriente', J: 'Potencia', K: 'Tiempo', L: 'Nivel', M: 'Humedad', N: 'Consistencia', P: 'Presión', Q: 'Cantidad', S: 'Velocidad', T: 'Temperatura', V: 'Vibración', W: 'Peso', X: 'Otro', Y: 'Evento', Z: 'Posición' };
const STOP = new Set('para con del los las por que una uno unos unas este esta esto como pero cuando donde entre sobre segun hacia desde hasta tras sin ante bajo cada todo toda todos todas otro otra muy mas ya hay fue ser esta estan tiene'.split(' '));
function parseTag(line) {
  const m = TAG_RE.exec(String(line || ''));
  if (!m) return null;
  const tipo = m[2].toUpperCase();
  return { tag: m[1] + tipo + m[3].toUpperCase(), area: m[1], tipo, variable: (VARS[tipo[0]] || 'Otro') + ' (' + tipo[0] + ')', accion: m[4].trim() };
}
function defStatsCat() {
  if (S.statsCat && cat(S.statsCat)) return S.statsCat;
  const nat = S.cats.find(c => norm(c.name) === 'nat');
  return (nat || kids(null)[0] || {}).id;
}
function openStats(id) { S.statsCat = id || defStatsCat(); go({ v: 'stats' }); }
function statsData() {
  const ids = desc(S.statsCat), from = S.statsDays ? Date.now() - S.statsDays * 864e5 : 0;
  const ns = S.notes.filter(n => ids.includes(n.cat) && new Date(n.created).getTime() >= from);
  const E = [];
  ns.forEach(n => {
    (n.items || []).forEach(i => { const t = parseTag(i.t); if (t) E.push(Object.assign(t, { ok: !!i.ok, item: true, n })); });
    String(n.text || '').split('\n').forEach(l => { const t = parseTag(l); if (t) E.push(Object.assign(t, { ok: false, item: false, n })); });
  });
  const count = (key, f) => { const m = new Map(); E.forEach(e => { const k = e[key]; if (!k) return; const o = m.get(k) || { k, c: 0, p: 0, last: '' }; o.c++; if (e.item && !e.ok) o.p++; if (e.n.created > o.last) o.last = e.n.created; m.set(k, o); }); return [...m.values()].sort((a, b) => b.c - a.c || a.k.localeCompare(b.k)); };
  const words = new Map();
  E.forEach(e => norm(e.accion).split(/[^a-zñ]+/).forEach(w => { if (w.length >= 4 && !STOP.has(w)) words.set(w, (words.get(w) || 0) + 1); }));
  return { notes: ns.length, E, pend: E.filter(e => e.item && !e.ok).length, tags: count('tag'), tipos: count('tipo'), vars: count('variable'), areas: count('area'),
    words: [...words.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12) };
}
function bars(list, color, max, click) {
  if (!list.length) return '<div class="empty" style="padding:10px">Sin datos</div>';
  const top = list[0].c;
  return list.slice(0, max).map(o => `<div class="bar"${click ? ` onclick="findTag('${esc(o.k)}')"` : ''}><div class="l"><span>${esc(o.k)}</span><span>${o.c}${o.p ? ` · <span class="dan">${o.p} pend.</span>` : ''}</span></div>
    <div class="b"><i style="width:${Math.max(4, Math.round(o.c / top * 100))}%;background:${color}"></i></div></div>`).join('');
}
function vStats() {
  if (!S.statsCat || !cat(S.statsCat)) S.statsCat = defStatsCat();
  if (!S.statsCat) return `<div class="top"><button class="ib" onclick="history.back()" aria-label="Volver"><i class="ti ti-arrow-left"></i></button><h1>Estadísticas</h1></div><div class="empty">Crea una categoría primero.</div>`;
  const d = statsData(), k = catColor(S.statsCat) || 'var(--ac)';
  return `<div class="top"><button class="ib" onclick="history.back()" aria-label="Volver"><i class="ti ti-arrow-left"></i></button><h1>Estadísticas</h1></div>
    <button class="catsel" onclick="statsPick()"><i class="ti ti-folder" style="color:${catColor(S.statsCat)}"></i><span>${esc(path(S.statsCat))}</span><i class="ti ti-chevron-down"></i></button>
    <div class="chp">${[[30, '30 días'], [90, '90 días'], [365, '1 año'], [0, 'Todo']].map(([v, t]) => `<button class="${S.statsDays === v ? 'on' : ''}" onclick="S.statsDays=${v};render()">${t}</button>`).join('')}</div>
    <div class="kp"><div><b>${d.notes}</b>notas</div><div><b>${d.E.length}</b>con TAG</div><div><b class="${d.pend ? 'dan' : ''}">${d.pend}</b>pendientes</div></div>
    ${d.E.length ? `<div class="sec">TAGs más repetidos · toca uno para ver sus notas</div>${bars(d.tags, k, 10, true)}
    <div class="sec">Por variable</div>${bars(d.vars, '#d85a30', 8)}
    <div class="sec">Por tipo</div>${bars(d.tipos, '#7f77dd', 8)}
    <div class="sec">Por área</div>${bars(d.areas, '#1d9e75', 6)}
    ${d.words.length ? `<div class="sec">Acciones más frecuentes</div><div class="words">${d.words.map(([w, c]) => `<span>${esc(w)} <b>${c}</b></span>`).join('')}</div>` : ''}`
    : '<div class="empty">No hay ítems que empiecen con un TAG en este periodo.<br>Ejemplo: <b>241TCV403: Revisar recorrido</b></div>'}
    <div class="sec">Hoja de cálculo</div>
    <div class="row" onclick="statsSheet()"><i class="ti ti-table ic" style="color:#3b6d11"></i><span class="nm">Actualizar hoja de cálculo</span><i class="ti ti-refresh n"></i></div>
    <div id="sslink"></div>`;
}
function statsPick() {
  const t = (pid, l) => kids(pid).map(c => `<div class="row${S.statsCat === c.id ? ' sel' : ''}" style="padding-left:${8 + l * 20}px" onclick="closeSheet();S.statsCat='${c.id}';render()">${fic(c.id)}<span class="nm">${esc(c.name)}</span><span class="n">${countDeep(c.id)}</span></div>` + t(c.id, l + 1)).join('');

function cardTap(id) { if (!S.sel) return openNote(id); S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); if (!S.sel.size) S.sel = null; keepScroll(render); }

function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

  sheet(`<h3>Mover ${S.sel.size} nota${S.sel.size === 1 ? '' : 's'} a…</h3>${t(null, 0)}`);

async function selBulk(changes, msg) {
  const ids = [...S.sel];
  try {
    const out = await api('bulkUpdate', ids, changes);
    out.forEach(upsert); S.sel = null; keepScroll(render); toast(msg);
  } catch (e) { toast('No se pudo: ' + errMsg(e), 4000); }
}
function selMoveTo(id) { closeSheet(); selBulk({ cat: id }, 'Movidas a ' + path(id)); }
function selPin(v) { if (!S.sel || !S.sel.size) return toast('Marca al menos una nota'); selBulk({ pinned: v }, v ? 'Notas fijadas' : 'Notas desfijadas'); }
async function selDel() {
  if (!S.sel || !S.sel.size) return toast('Marca al menos una nota');

async function addPhotos(files) {

function resize(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('imagen no válida'));
    img.src = u;
  });
}

function dictar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const tip = () => { toast('Usa el micrófono del teclado del celular para dictar', 4500); const t = $('#tx'); if (t) t.focus(); };
  if (!SR) return tip();
  try {
    const r = new SR(); r.lang = 'es-CL'; r.interimResults = false;
    r.onstart = () => toast('Escuchando… habla ahora', 6000);
    r.onerror = tip;
    r.onresult = e => {
      const t = Array.from(e.results).map(x => x[0].transcript).join(' '), ta = $('#tx');
      if (!ta || !S.edit) return;
      S.edit.text = (S.edit.text ? S.edit.text.replace(/\s*$/, ' ') : '') + t;
      ta.value = S.edit.text; grow(ta); changed();
    };
    r.start();
  } catch (e) { tip(); }
}

// ── compartir PDF ──
const hasContent = n => !isEmpty(Object.assign({}, n, { reminder: null }));
const PDF = { key: '', file: null };
async function getPdfFile() {
  const n = clean(S.edit), key = JSON.stringify(n);
  if (PDF.key === key && PDF.file) return PDF.file;
  const d = await api('getPdf', n);
  const bin = atob(d.b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  PDF.key = key; PDF.file = new File([u8], d.name, { type: 'application/pdf' });
  return PDF.file;
}
function busySheet(t) { sheet(`<div class="load" style="padding:30px 0"><i class="ti ti-loader-2 spin"></i> ${esc(t)}</div>`); }
async function sharePdf(mode) {
  if (!hasContent(S.edit)) return toast('La nota está vacía');
  busySheet('Generando PDF…');
  let f;
  try { f = await getPdfFile(); } catch (e) { closeSheet(); return toast('No se pudo generar el PDF: ' + errMsg(e), 4000); }
  // El navegador exige un toque nuevo para compartir/descargar, por eso se muestra un botón.
  sheet(`<h3>${esc(f.name)}</h3><p>PDF listo (${Math.max(1, Math.round(f.size / 1024))} KB).</p>
    <div class="acts">${mode === 'wa'
      ? '<button class="btn pri" style="flex:1;justify-content:center;background:#1d9e75;border-color:#1d9e75" onclick="waGo()"><i class="ti ti-brand-whatsapp"></i>Enviar por WhatsApp</button>'
      : '<button class="btn pri" style="flex:1;justify-content:center" onclick="closeSheet();download()"><i class="ti ti-download"></i>Descargar</button>'}</div>`);
}
function download() {
  const f = PDF.file; if (!f) return;
  const u = URL.createObjectURL(f), a = document.createElement('a');
  a.href = u; a.download = f.name; a.target = '_self';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
  toast('PDF descargado');
}
async function waGo() {
  const f = PDF.file; if (!f) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title: f.name });
      closeSheet(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') { closeSheet(); return; } }
  // El celular no permitió compartir directo: se descarga y se abre WhatsApp para adjuntarlo.
  download();
  sheet(`<h3>PDF descargado</h3><p>Abre WhatsApp, elige el chat y adjunta el PDF con el clip (📎 › Documento). Está en Descargas.</p>
    <div class="acts"><button class="btn" onclick="closeSheet()">Cerrar</button><span style="flex:1"></span>
    <a class="btn pri" style="text-decoration:none;background:#1d9e75;border-color:#1d9e75" href="https:\/\/wa.me/" target="_blank" rel="noopener" onclick="closeSheet()"><i class="ti ti-brand-whatsapp"></i>Abrir WhatsApp</a></div>`);
}
function mailSheet() {
  if (!hasContent(S.edit)) return toast('La nota está vacía');
  let last = ''; try { last = localStorage.getItem('bn_mail') || ''; } catch (e) {}
  sheet(`<h3>Enviar PDF por correo</h3><label class="lbl" for="mto">Para</label>

    <div class="acts"><span style="flex:1"></span><button class="btn" onclick="closeSheet()">Cancelar</button><button class="btn pri" onclick="mailGo()"><i class="ti ti-send"></i>Enviar</button></div>

async function mailGo() {
  const to = $('#mto').value.trim();
  if (!/^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(to)) return toast('Revisa el correo');

// ── guardado automático ──
const Q = new Map(); let tmr = null, busy = false, lastErr = false;
const isEmpty = n => !String(n.title || '').trim() && !String(n.text || '').trim() && !(n.items || []).some(i => String(i.t).trim()) && !(n.photos || []).length && !n.reminder;
const clean = n => ({ id: n.id, title: n.title, text: n.text, items: n.items, cat: n.cat, pinned: n.pinned, photos: n.photos, reminder: n.reminder });
function changed() { Q.set(S.edit.id, S.edit); status(); clearTimeout(tmr); tmr = setTimeout(flush, 1500); }
function upsert(n) { const i = S.notes.findIndex(x => x.id === n.id); if (i >= 0) S.notes[i] = n; else S.notes.push(n); }
async function flush() {
  clearTimeout(tmr); tmr = null;
  if (busy) { tmr = setTimeout(flush, 600); return; }
  const ed = Q.values().next().value;
  if (!ed) return;
  Q.delete(ed.id);
  if (isEmpty(ed) && !S.notes.some(n => n.id === ed.id)) return flush();
  busy = true; status();
  try {
    const n = await api('saveNote', clean(ed));
    upsert(n); ed.fileId = n.fileId; ed.eventId = n.eventId; ed.updated = n.updated; lastErr = false;
  } catch (e) {
    if (!Q.has(ed.id)) Q.set(ed.id, ed);
    busy = false; lastErr = true; status();
    toast('No se pudo guardar (' + errMsg(e) + '). Reintento en 5 s', 4000);
    tmr = setTimeout(flush, 5000); return;
  }
  busy = false; status();
  if (Q.size && !tmr) tmr = setTimeout(flush, 300);
}
function status() {
  const e = $('#st'); if (!e || !S.edit) return;
  const mine = Q.has(S.edit.id);
  if (lastErr && mine) { e.className = 'st err'; e.innerHTML = '<i class="ti ti-alert-triangle"></i> Sin guardar'; }
  else if (busy || mine) { e.className = 'st'; e.innerHTML = '<i class="ti ti-loader-2 spin"></i> Guardando…'; }
  else if (S.notes.some(n => n.id === S.edit.id)) { e.className = 'st ok'; e.innerHTML = '<i class="ti ti-cloud-check"></i> Guardado en Drive'; }
  else { e.className = 'st'; e.textContent = 'Nota nueva'; }
}
function leaveNote() {
  const ed = S.edit; S.edit = null;
  if (!ed) return;
  if (isEmpty(ed) && !S.notes.some(n => n.id === ed.id)) { Q.delete(ed.id); return; }
  if (Q.has(ed.id)) { upsert(Object.assign({}, ed, { updated: new Date().toISOString() })); flush(); }
}
window.addEventListener('beforeunload', e => { if (Q.size) { flush(); e.preventDefault(); e.returnValue = ''; } });

function init() {

  return `<div class="top"><h1>Notes</h1></div>
    <div style="text-align:center;margin:8px 0 4px"><img src="icons/icon-192.png" width="84" height="84" alt="" style="border-radius:20px"></div>
    <p style="color:var(--tx2);line-height:1.5;margin:6px 4px 4px">Conecta la app con tus notas de Google Drive. Se pide una sola vez en este celular.</p>
    <label class="lbl" for="cu">URL de la API (termina en /exec)</label>
    <input id="cu" class="inp" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.url)}">
    <label class="lbl" for="ck">Clave</label>
    <input id="ck" class="inp" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="La que te dio crearClave()" onkeydown="if(event.key==='Enter')connect()">
    <div class="acts"><button id="cbtn" class="btn pri" style="flex:1;justify-content:center" onclick="connect()"><i class="ti ti-plug-connected"></i>Conectar</button></div>
    <p class="hint">La clave queda guardada solo en este celular. Si la pierdes, ejecuta cambiarClave() en Apps Script y conéctate otra vez.</p>`;
}
async function connect() {
  const url = $('#cu').value.trim(), key = $('#ck').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return toast('Revisa la URL: debe empezar con https://script.google.com/macros/s/ y terminar en /exec', 4500);
  if (key.length < 16) return toast('Escribe la clave completa');
  const prev = { url: CFG.url, key: CFG.key }, btn = $('#cbtn');
  CFG.url = url; CFG.key = key; btn.innerHTML = '<i class="ti ti-loader-2 spin"></i> Conectando…';
  try {
    const d = await api('getData');
    try { localStorage.setItem('nt_url', url); localStorage.setItem('nt_key', key); } catch (e) {}
    applyData(d); S.stack = []; S.view = { v: 'home' }; render(); toast('Conectado a tus notas');
    api('setAppUrl', location.origin + location.pathname).catch(() => {});
  } catch (e) {
    CFG.url = prev.url; CFG.key = prev.key;
    btn.innerHTML = '<i class="ti ti-plug-connected"></i>Conectar';
    toast('No se pudo conectar: ' + errMsg(e), 5000);
  }
}
function settings() {
  const u = CFG.url ? CFG.url.replace(/^https:\/\/script\.google\.com\/macros\/s\//, '').slice(0, 10) + '…' : 'vista previa';
  sheet(`<h3>Ajustes</h3><p>Conectado a la API <b>${esc(u)}</b> · versión ${VERSION}</p>
    <button class="btn wide" onclick="closeSheet();go({v:'setup'})"><i class="ti ti-plug"></i>Cambiar URL o clave</button>
    <button class="btn wide" onclick="closeSheet();location.reload()"><i class="ti ti-refresh"></i>Recargar la app</button>
    <button class="btn wide dan" onclick="disconnect()"><i class="ti ti-logout"></i>Desconectar este celular</button>
    <p class="hint">Desconectar borra la clave y la copia local de este celular. Tus notas siguen en Drive.</p>`);
}
async function disconnect() {
  closeSheet();
  if (!(await confirmar('¿Desconectar este celular?', 'Se borran la clave y la copia local. Tus notas siguen en Drive.', 'Desconectar'))) return;
  try { ['nt_url', 'nt_key', 'nt_cache'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  CFG.url = ''; CFG.key = ''; S.cats = []; S.notes = []; S.links = []; S.stack = []; S.view = { v: 'setup' }; render();
}
if ('serviceWorker' in navigator && !window.__mockApi) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { history.replaceState({ d: 0 }, ''); } catch (e) {}
window.addEventListener('popstate', e => {
  // Atrás con una hoja abierta o en modo selección: se cierra eso y no se cambia de pantalla.
  if ($('#ov') || S.sel) { closeSheet(); if (S.sel) { S.sel = null; keepScroll(render); } try { history.pushState({ d: S.stack.length }, ''); } catch (x) {} return; }
  const d = (e.state && e.state.d) || 0;
  while (S.stack.length > d) back();
});
init();
</script>
</body>
</html>
